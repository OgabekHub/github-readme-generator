<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Brand colors gradient -->
    <linearGradient id="brand-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C5CFC" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <!-- AI Sparkle gradient -->
    <linearGradient id="ai-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>
    <!-- Subtle glow filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="5" y="5" width="90" height="90" rx="26" fill="#111118" stroke="url(#brand-grad)" stroke-width="1.5" />

  <!-- Code bracket / document silhouette -->
  <path d="M 28 32 C 28 29, 30 27, 33 27 L 58 27 L 72 41 L 72 68 C 72 71, 70 73, 67 73 L 33 73 C 30 73, 28 71, 28 68 Z" 
        fill="#161622" stroke="url(#brand-grad)" stroke-width="2" />

  <!-- Git Branch Nodes -->
  <g stroke="#7C5CFC" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 42 42 L 42 60" />
    <path d="M 42 51 C 48 51, 48 45, 56 45" />
    <!-- Node circles -->
    <circle cx="42" cy="42" r="2.5" fill="#111118" stroke="#7C5CFC" stroke-width="2.5" />
    <circle cx="42" cy="60" r="2.5" fill="#111118" stroke="#7C5CFC" stroke-width="2.5" />
    <circle cx="56" cy="45" r="2.5" fill="#a855f7" stroke="#a855f7" stroke-width="2.5" />
  </g>

  <!-- AI Sparkles -->
  <path d="M 68 22 C 68 29, 68 29, 75 29 C 68 29, 68 29, 68 36 C 68 29, 68 29, 61 29 C 68 29, 68 29, 68 22 Z" 
        fill="url(#ai-grad)" filter="url(#glow)" />
  <path d="M 52 18 C 52 21, 52 21, 55 21 C 52 21, 52 21, 52 24 C 52 21, 52 21, 49 21 C 52 21, 52 21, 52 18 Z" 
        fill="url(#ai-grad)" opacity="0.8" />
</svg>
