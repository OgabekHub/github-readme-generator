<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <title>GitHub README Generator</title>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7C5CFC"/>
      <stop offset="1" stop-color="#A855F7"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".22"/>
      <stop offset=".55" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Brand tile -->
  <rect width="64" height="64" rx="16" fill="url(#tile)"/>
  <rect width="64" height="64" rx="16" fill="url(#shine)"/>

  <!-- README file with a folded corner -->
  <path d="M17 12h15l9 9v27a4 4 0 0 1-4 4H17a4 4 0 0 1-4-4V16a4 4 0 0 1 4-4z" fill="#fff"/>
  <path d="M32 12v6a3 3 0 0 0 3 3h6z" fill="#DDD6FE"/>

  <!-- Markdown heading "#" -->
  <path d="M25 29.5l-1.8 16M32 29.5l-1.8 16M20 34.5h14M19 40.5h14" stroke="#6D4AFF" stroke-width="3.4" stroke-linecap="round" fill="none"/>

  <!-- AI sparkles -->
  <path d="M50.5 7.5c.9 4.9 2.7 6.7 7.6 7.6-4.9.9-6.7 2.7-7.6 7.6-.9-4.9-2.7-6.7-7.6-7.6 4.9-.9 6.7-2.7 7.6-7.6z" fill="#fff"/>
  <path d="M52 28.5c.4 2 1 2.6 3 3-2 .4-2.6 1-3 3-.4-2-1-2.6-3-3 2-.4 2.6-1 3-3z" fill="#fff" opacity=".85"/>
</svg>
